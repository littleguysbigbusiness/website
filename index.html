<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Cloud Browser</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #222; color: #fff; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; max-width: 1280px; margin: 0 auto 10px auto; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: none; font-size: 16px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        .browser-container { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; overflow: hidden; }
        #browser-view { width: 100%; display: block; border: 2px solid #444; background: #fff; cursor: crosshair; }
        .loading-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="url-input" value="https://example.com" placeholder="Enter URL to browse securely...">
        <button onclick="goToUrl()">Go</button>
    </div>

    <div class="browser-container">
        <img id="browser-view" src="" alt="Live Cloud Stream" onclick="handleBrowserClick(event)">
        <div id="loading" class="loading-overlay">Updating Stream...</div>
    </div>

    <script>
        const view = document.getElementById('browser-view');
        const loading = document.getElementById('loading');
        const urlInput = document.getElementById('url-input');

        function showLoading(state) {
            loading.style.display = state ? 'flex' : 'none';
        }

        function updateDisplay(data) {
            if (data.screenshot) view.src = data.screenshot;
            if (data.currentUrl) urlInput.value = data.currentUrl;
        }

        async function goToUrl() {
            showLoading(true);
            try {
                const response = await fetch('/navigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput.value })
                });
                const data = await response.json();
                updateDisplay(data);
            } catch (err) {
                alert('Connection error during navigation.');
            } finally {
                showLoading(false);
            }
        }

        async function handleBrowserClick(event) {
            showLoading(true);
            
            // Calculate where the user clicked relative to the displayed image box
            const rect = view.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            // Map the layout coordinates directly to the server's 1280x720 canvas
            const scaleX = 1280 / rect.width;
            const scaleY = 720 / rect.height;

            const targetX = Math.round(clickX * scaleX);
            const targetY = Math.round(clickY * scaleY);

            try {
                const response = await fetch('/click', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ x: targetX, y: targetY })
                });
                const data = await response.json();
                updateDisplay(data);
            } catch (err) {
                alert('Failed to transmit action click.');
            } finally {
                showLoading(false);
            }
        }

        // Initialize view frame
        window.onload = goToUrl;
    </script>
</body>
</html>
