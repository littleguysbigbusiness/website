<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Browser View</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #222; color: #fff; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        input { flex: 1; padding: 8px; border-radius: 4px; border: none; }
        button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #browser-view { width: 100%; max-width: 1280px; border: 2px solid #444; background: #fff; display: block; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="url-input" value="https://example.com" placeholder="Enter website URL...">
        <button onclick="goToUrl()">Go</button>
    </div>

    <img id="browser-view" src="" alt="Browser Viewport will appear here">

    <script>
        async function goToUrl() {
            const url = document.getElementById('url-input').value;
            const view = document.getElementById('browser-view');
            
            view.style.opacity = '0.5'; // Visual feedback during loading

            try {
                const response = await fetch('/navigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                if (data.screenshot) {
                    view.src = data.screenshot;
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Failed to connect to cloud browser.');
            } finally {
                view.style.opacity = '1';
            }
        }
        
        // Load initial page on start
        window.onload = goToUrl;
    </script>
</body>
</html>
